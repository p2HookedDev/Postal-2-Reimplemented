name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --workspace
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static

      - name: Package
        shell: pwsh
        run: |
          $exe = "target/release/p2-game.exe"
          # Bevy and Rust's std are DLLs the exe imports by hashed name; the C runtime ships beside them.
          $imports = [regex]::Matches([IO.File]::ReadAllText((Resolve-Path $exe), [Text.Encoding]::Latin1), "(bevy_dylib|std)-[0-9a-f]+\.dll") | ForEach-Object Value | Sort-Object -Unique
          $sysroot = (rustc --print sysroot).Trim()
          $dlls = foreach ($name in $imports) {
            $path = @("target/release/deps/$name", "$sysroot/lib/rustlib/x86_64-pc-windows-msvc/lib/$name") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $path) { throw "the exe imports $name, which is not built" }
            $path
          }
          New-Item -ItemType Directory -Force dist/P2Reimplemented/Packages | Out-Null
          Copy-Item script/P2Modern/P2Modern.u dist/P2Reimplemented/Packages/
          New-Item -ItemType Directory -Force dist/P2Reimplemented/assets | Out-Null
          Copy-Item -Recurse assets/shaders dist/P2Reimplemented/assets/shaders
          Copy-Item -Recurse crates/p2-render/textures dist/P2Reimplemented/textures
          Copy-Item $exe, LICENSE, README.md dist/P2Reimplemented/
          Copy-Item $dlls, "$env:SystemRoot/System32/vcruntime140.dll" dist/P2Reimplemented/
          Compress-Archive dist/P2Reimplemented "dist/P2Reimplemented-$env:GITHUB_REF_NAME-windows-x64.zip"

      - name: Publish
        shell: pwsh
        run: |
          $version = [regex]::Escape($env:GITHUB_REF_NAME.TrimStart("v"))
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $version\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $env:GITHUB_REF_NAME" }
          Set-Content dist/notes.md $section.Groups[1].Value.Trim()
          gh release create $env:GITHUB_REF_NAME "dist/P2Reimplemented-$env:GITHUB_REF_NAME-windows-x64.zip" --verify-tag --title $env:GITHUB_REF_NAME --notes-file dist/notes.md

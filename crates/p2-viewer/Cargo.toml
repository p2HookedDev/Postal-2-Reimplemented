[package]
name = "p2-viewer"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Faster incremental builds during development. Never for release builds.
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = ["async_executor", "bevy_asset", "bevy_log", "bevy_state", "std", "bevy_winit", "bevy_clipboard", "multi_threaded", "bevy_camera", "bevy_color", "bevy_curve", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_window", "bevy_light", "bevy_mikktspace", "bevy_render", "bevy_core_pipeline", "bevy_anti_alias", "bevy_pbr", "bevy_post_process", "bevy_audio", "wav", "vorbis", "pbr_clustered_decals"] }
bevy_egui.workspace = true
p2-assets.workspace = true
p2-bevy-assets.workspace = true
p2-package.workspace = true
p2-script.workspace = true
p2-collision.workspace = true
p2-engine.workspace = true
p2-math.workspace = true

[lints]
workspace = true

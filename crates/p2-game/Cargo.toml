[package]
name = "p2-game"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Postal2Reimplemented"
path = "src/main.rs"

[features]
# Developer builds only: Tracy profiler spans.
tracy = ["bevy/trace_tracy"]
# Developer builds only: time per Bevy system in diagnostics.txt.
profile = ["bevy/trace", "p2-engine/profile"]

[dependencies]
anyhow.workspace = true
bevy = { workspace = true, features = ["dynamic_linking", "async_executor", "bevy_asset", "bevy_log", "bevy_state", "std", "bevy_winit", "bevy_clipboard", "multi_threaded", "bevy_camera", "bevy_color", "bevy_curve", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_window", "bevy_light", "bevy_mikktspace", "bevy_render", "bevy_core_pipeline", "bevy_anti_alias", "bevy_pbr", "bevy_post_process", "bevy_audio", "wav", "vorbis", "pbr_clustered_decals", "sysinfo_plugin"] }
bevy_egui = { workspace = true, features = ["manage_clipboard"] }
p2-dylib-engine.workspace = true
p2-engine.workspace = true
p2-host.workspace = true
p2-render.workspace = true
p2-package.workspace = true
p2-vm.workspace = true

[lints]
workspace = true

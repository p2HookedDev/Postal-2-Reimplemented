[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/p2HookedDev/Postal-2-Reimplemented"

[workspace.dependencies]
memmap2 = "0.9"
p2-package = { path = "crates/p2-package" }
p2-assets = { path = "crates/p2-assets" }
p2-bevy-assets = { path = "crates/p2-bevy-assets" }
p2-script = { path = "crates/p2-script" }
p2-vm = { path = "crates/p2-vm" }
p2-collision = { path = "crates/p2-collision" }
p2-engine = { path = "crates/p2-engine" }
p2-host = { path = "crates/p2-host" }
p2-render = { path = "crates/p2-render" }
p2-particles = { path = "crates/p2-particles" }
p2-render-cpu = { path = "crates/p2-render-cpu" }
p2-physics = { path = "crates/p2-physics" }
p2-math = { path = "crates/p2-math" }
p2-movie = { path = "crates/p2-movie" }
p2-test-package = { path = "crates/p2-test-package" }
p2-dylib-core = { path = "crates/p2-dylib-core" }
p2-dylib-render = { path = "crates/p2-dylib-render" }
p2-dylib-engine = { path = "crates/p2-dylib-engine" }
anyhow = "1"
rapier3d = { version = "0.36", features = ["parallel"] }
rayon = "1"
lz4_flex = "0.14"
bevy = { version = "0.20", default-features = false }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
dirs = "7"
rfd = "0.17"
rodio = { version = "0.22", default-features = false }
# The next four must match the versions Bevy 0.20 uses.
wgpu-types = { version = "30", default-features = false }
bytemuck = "1"
naga = { version = "30", default-features = false }
wesl = { version = "0.6", features = ["naga-ext"] }
thiserror = "2"
winreg = "0.55"
steamlocate = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rustc-hash = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
print_stdout = "warn"
# Bevy query types trip it on every wide query.
type_complexity = "allow"
too_many_arguments = "warn"
too_many_lines = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
trivially_copy_pass_by_ref = "warn"
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
format_push_string = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
needless_collect = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
use_self = "warn"

# Line tables only: full debug info made `target` about 20 GB.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies' debug assertions and wgpu's debug flags cost real time on the render thread.
[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

# Our crates do the per-frame CPU work: fully optimised in debug too, assertions on.
[profile.dev.package.p2-vm]
opt-level = 3
[profile.dev.package.p2-script]
opt-level = 3
[profile.dev.package.p2-collision]
opt-level = 3
[profile.dev.package.p2-assets]
opt-level = 3
[profile.dev.package.p2-package]
opt-level = 3
[profile.dev.package.p2-particles]
opt-level = 3
[profile.dev.package.p2-physics]
opt-level = 3
[profile.dev.package.p2-math]
opt-level = 3
# The generic VM is compiled where it is instantiated, which is here.
[profile.dev.package.p2-engine]
opt-level = 3
[profile.dev.package.p2-host]
opt-level = 3
[profile.dev.package.p2-render]
opt-level = 3
# Below opt-level 2 a DLL exports every generic instance, toward Windows' 65535 limit.
[profile.dev.package.p2-bevy-assets]
opt-level = 3
[profile.dev.package.p2-render-cpu]
opt-level = 3
[profile.dev.package.p2-movie]
opt-level = 3

# Our shipped PDBs name the functions and lines in a player's panic backtrace.
[profile.release]
codegen-units = 1
debug = "line-tables-only"

# At opt-level "s" rustc shares generic instances, which put 102781 exports in `bevy_dylib`, past Windows' 65535.
[profile.release.package."*"]
opt-level = 3
debug = false
